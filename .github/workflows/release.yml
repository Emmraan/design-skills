name: release

on:
  push:
    branches: [main]
    # Skip pushes that touch ONLY non-releasable files. Prose docs always carry
    # docs:/chore: prefixes and content pushes always carry add/update <slug>: —
    # neither can ever cut a release (only feat:/fix: do), so running the job just
    # for PSR to no-op wastes a runner. INDEX.md + references/** are generated or
    # content (websites source of truth, retrieval indexes, editorial collections):
    # an add/update <slug>: push touches only these. Anything else (code, config)
    # still runs the workflow; PSR itself no-ops when there is nothing to release.
    # Accepted tradeoff (same as before): a feat:/fix: touching ONLY ignored paths
    # rides along silently in the next release.
    paths-ignore: ['README.md', 'CONTRIBUTING.md', 'AGENTS.md', 'CHANGELOG.md',
      'LICENSE', 'CODE_OF_CONDUCT.md', 'SECURITY.md',
      'INDEX.md', 'references/**']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "python-semantic-release>=10.6.2"

      - name: Validate repository
        run: python scripts/validate.py

      - name: Release
        env:
          # python-semantic-release reads its GitHub API token from GH_TOKEN
          # (not GITHUB_TOKEN) — without it, tag+push succeed but creating
          # the GitHub Release fails and the job exits 1.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version
