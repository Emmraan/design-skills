name: release

on:
  push:
    branches: [main]
    # Skip pushes that touch ONLY prose/doc files — they always carry docs:/chore:
    # prefixes, which can never cut a release. Anything else (code, content, config)
    # runs the workflow; PSR itself no-ops when there is nothing to release. A missed
    # feat: on a docs-only change would ride along silently in the next release.
    paths-ignore: ['README.md', 'CONTRIBUTING.md', 'AGENTS.md', 'CHANGELOG.md',
      'LICENSE', 'CODE_OF_CONDUCT.md', 'SECURITY.md']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "python-semantic-release>=10.6.2"

      - name: Validate repository
        run: python scripts/validate.py

      - name: Release
        env:
          # python-semantic-release reads its GitHub API token from GH_TOKEN
          # (not GITHUB_TOKEN) — without it, tag+push succeed but creating
          # the GitHub Release fails and the job exits 1.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version
