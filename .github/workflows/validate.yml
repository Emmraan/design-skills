name: validate

on:
  push:
    branches: [main]
    # Plan-tracker-only commits (BUILD.md) don't affect repo consistency — skip CI.
    paths-ignore: ['BUILD.md']
  pull_request:
    branches: [main]
    paths-ignore: ['BUILD.md']

jobs:
  validate:
    name: rebuild + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate repository
        run: python scripts/validate.py

      - name: Rebuild-sync check (D9 — regenerate, never hand-edit)
        run: |
          python scripts/rebuild.py
          git diff --exit-code
