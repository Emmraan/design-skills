name: validate

on:
  # Run only when files that validation covers change. validate.py reads SKILL.md,
  # every *.md (link check), references/**, INDEX.md, requirements (env), plus the
  # scripts/tests/.gitattributes that drive the checks — anything else cannot break it.
  push:
    branches: [main]
    paths: ['references/**', 'scripts/**', 'tests/**', 'SKILL.md', 'INDEX.md',
      'requirements*.txt', '.gitattributes', '.github/workflows/validate.yml',
      '**/*.md', 'LICENSE']
  pull_request:
    branches: [main]
    paths: ['references/**', 'scripts/**', 'tests/**', 'SKILL.md', 'INDEX.md',
      'requirements*.txt', '.gitattributes', '.github/workflows/validate.yml',
      '**/*.md', 'LICENSE']

jobs:
  validate:
    name: rebuild + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate repository
        run: python scripts/validate.py

      - name: Rebuild-sync check (D9 — regenerate, never hand-edit)
        run: |
          python scripts/rebuild.py
          git diff --exit-code
